name: Build Flutter APK

'on':
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          cache: true

      - name: Check versions
        run: |
          flutter --version
          java -version
          
      - name: Flutter clean
        run: flutter clean

      - name: Install dependencies
        run: flutter pub get

      - name: Configure Gradle memory
        run: |
          echo "org.gradle.jvmargs=-Xmx6G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError" >> android/gradle.properties

      - name: Build Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Prepare APK
        run: |
          mkdir -p release
          cp build/app/outputs/flutter-apk/app-release.apk \
             release/patroli-satpam-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: patroli-satpam-apk
          path: release/patroli-satpam-release.apk
          retention-days: 30
